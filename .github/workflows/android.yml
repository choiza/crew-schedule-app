name: Android 앱 만들기

# main 에 올리면 APK 를 만들어 "latest" 릴리스에 올린다.
# 가족은 https://github.com/<계정>/<저장소>/releases/latest 에서 받는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 준비
        run: npm install

      - name: 테스트
        run: npm test

      - name: 웹 파일을 앱에 넣기
        run: npm run build:www && npx cap sync android

      - name: 서명 키 풀기
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::저장소 Settings > Secrets 에 ANDROID_KEYSTORE_BASE64 등 서명 키 4개를 넣어 주세요. README 의 '안드로이드 앱' 참고."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: APK 만들기
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/oneul-minju.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: oneul-minju-apk
          path: oneul-minju.apk

      - name: latest 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 오늘 민주는 (안드로이드 최신)
          body: |
            안드로이드 폰에서 oneul-minju.apk 를 받아 설치합니다.
            처음 설치할 때 "출처를 알 수 없는 앱 허용"을 한 번 켜야 합니다.
            빌드 번호 ${{ github.run_number }}, 커밋 ${{ github.sha }}
          files: oneul-minju.apk
          make_latest: true
